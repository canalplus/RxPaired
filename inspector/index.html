<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="The RxPlayer's light remote debugger" />
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' ws: wss:"
    />
    <title>RxPaired-inspector</title>
    <style>
      body {
        font-family: sans-serif;
      }
      body.light {
        background-color: #e5e5e5;
        color: #000;
        color-scheme: light;
      }
      body.dark {
        background-color: #000;
        color: #fff;
        color-scheme: dark;
      }

      ul {
        margin: 0px;
      }

      canvas {
        max-width: 100%;
      }

      .light a {
        color: #000;
      }

      .dark a {
        color: #fff;
      }

      .fade-out {
        opacity: 1;
        animation: fadeout 2s linear;
      }

      @keyframes fadeout {
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9em;
      }

      table td,
      table th {
        border: 1px solid #ddd;
        padding: 7px;
        text-align: center;
      }

      .light table tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      .dark table tr:nth-child(even) {
        background-color: #29412c;
      }

      .light table th {
        background-color: #dbdbdb;
        color: #4a4747;
        border: 1px solid #b6b5b5;
      }

      .dark table th {
        background-color: #262626;
        color: white;
      }

      .light table tr:hover {
        background-color: #ddd;
        color: #000;
      }

      .dark table tr:hover {
        background-color: #ddd;
        color: #000;
      }

      .code-details {
        padding: 2px 0px 0px 5px;
      }

      .code-details > pre {
        background-color: #f5f5f5;
        padding: 4px;
        border: 1px dotted black;
      }

      .dark button {
        background-color: #000;
        border: 1px solid #444;
      }

      .button-input-right {
        margin-left: 5px;
      }

      .dark .code-details > pre {
        background-color: #1a1a1a;
        border: 1px dotted #595959;
      }

      summary {
        cursor: pointer;
        font-style: italic;
      }

      .error-msg {
        font-weight: bold;
        padding: 5px;
        background-color: #cc0000;
        color: #ffffff;
      }

      .header {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        margin-top: 5px;
        margin-bottom: 10px;
      }

      .header-item {
        margin: 0px 3px;
        padding: 3px 7px;
        font-size: 18px;
      }

      .header-item.page-title {
        font-weight: bold;
        font-size: 19px;
        white-space: nowrap;
      }

      .header-item button,
      .header-item label {
        cursor: pointer;
        border-radius: 2px;
        margin: 0px 3px;
        font-size: 13px;
        padding: 3px 8px;
      }

      .header-item label {
        display: inline-block;
      }

      .header-item input[type="checkbox"] {
        display: none;
      }

      .dark .header-item button,
      .dark .header-item label {
        background-color: #111;
        border: 1px dotted #ccc;
        color: #ddd;
      }
      .light .header-item button,
      .light .header-item label {
        background-color: #eee;
        border: 1px dotted #444;
        color: #111;
      }

      .header-item button:disabled {
        cursor: auto;
      }
      .dark .header-item button:disabled {
        background-color: #464646;
      }
      .light .header-item button:disabled {
        background-color: #dbdbdb;
        color: #444;
        border: 1px dotted #868686;
      }

      .token-presentation {
        margin-bottom: 25px;
        padding-top: 0px;
        border-bottom: 1px solid #666;
      }

      .token-presentation h2 {
        margin-top: 5px;
      }

      .persistent-token-table {
        width: auto;
      }

      .persistent-token-creation {
        border: 1px solid #b6b5b5;
        margin-top: 10px;
        padding: 10px;
      }

      .page-input-block {
        margin: 10px;
        padding: 10px;
        width: auto;
      }

      .token-block {
        max-width: 1000px;
      }

      .input-title {
        font-weight: bold;
        margin-bottom: 8px;
      }

      .light .page-input-block {
        border: 1px solid #ececec;
        box-shadow: rgba(100, 101, 111, 0.2) 0px 7px 29px 0px;
        background-color: #f0f0f0;
      }

      .dark .page-input-block {
        border: rgb(229 255 222);
        box-shadow: rgb(158 178 153 / 20%) 0px 7px 29px 8px;
        background-color: rgb(12 14 11);
      }

      .temporary-tokens-title {
        font-size: 1.1em;
        border-bottom: 1px dotted black;
      }

      .persistent-tokens-title {
        font-size: 1.1em;
        border-bottom: 1px dotted black;
      }

      .token-header-value {
        border-radius: 5px;
        padding: 6px 13px;
        white-space: nowrap;
      }

      .no-token-tutorial {
        font-size: 0.97em;
        max-width: 800px;
        margin: 10px;
        padding: 10px;
      }

      .light .token-header-value {
        background-color: #cbcbcb;
      }
      .dark .token-header-value {
        background-color: #242a23;
      }

      .token-title {
        text-align: center;
        font-family: monospace;
      }

      .token-title-val {
        font-weight: normal;
      }
      .light .token-title-val {
        color: #990033;
      }
      .dark .token-title-val {
        color: #d3ffcf;
      }

      .light .emphasized {
        color: #990033;
      }
      .dark .emphasized {
        color: #d3ffcf;
      }

      .module-wrapper {
        margin: 5px;
        box-sizing: border-box;
        width: calc(100% - 10px);
        overflow: auto;
      }

      .inspector-help {
        margin: 8px 5px 12px;
        border: 1px solid #cbd4da;
        background-color: #f4f7f9;
      }

      .dark .inspector-help {
        border-color: #3b454a;
        background-color: #171c20;
      }

      .inspector-help summary {
        font-style: normal;
        font-weight: normal;
        padding: 7px 10px;
      }

      .inspector-help > div {
        padding: 4px 12px 12px;
      }

      .inspector-workspace {
        display: grid;
        grid-template-columns: minmax(0, var(--log-pane-width, 50%)) minmax(
            0,
            1fr
          );
        position: relative;
        align-items: start;
      }

      .inspector-workspace.logs-collapsed {
        grid-template-columns: 120px minmax(0, 1fr);
      }

      .inspector-log-pane,
      .inspector-modules-pane {
        min-width: 0;
      }

      .inspector-log-pane {
        position: sticky;
        top: 8px;
        max-height: calc(100vh - 16px);
        overflow: auto;
      }

      .inspector-pane-splitter {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--log-pane-width, 50%);
        width: 14px;
        transform: translateX(-50%);
        cursor: col-resize;
        touch-action: none;
      }

      .inspector-pane-splitter:focus-visible {
        outline: 2px solid #4781a8;
      }

      .inspector-workspace.logs-collapsed .inspector-pane-splitter,
      .inspector-workspace.logs-collapsed
        .inspector-log-pane
        > .module-wrapper
        > .module-body {
        display: none;
      }

      .inspector-modules-pane > .module-wrapper {
        display: block;
      }

      @media (max-width: 850px) {
        .inspector-workspace,
        .inspector-workspace.logs-collapsed {
          display: block;
        }

        .inspector-log-pane {
          position: static;
          max-height: none;
        }

        .inspector-pane-splitter {
          display: none;
        }
      }

      .light .module-wrapper {
        border: 1px solid #b2b5bf;
        background-color: #fff;
      }
      .dark .module-wrapper {
        border: 1px solid #5c5c5c;
        background-color: #0d0d0d;
      }

      .module-title {
        font-weight: bold;
        padding: 3px 3px 3px 9px;
        font-size: 14px;
        margin: 0px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .light .module-title {
        color: #000;
        background: #abdffd;
        background: linear-gradient(to left, #fff, #f2f2f2);
        border-bottom: 1px dotted #828282;
      }
      .dark .module-title {
        color: #fff;
        background-color: #242424;
        background-image: linear-gradient(191deg, #444 0%, #242424 74%);
      }

      .module-btn {
        margin: 0px 2px;
        cursor: pointer;
        border-radius: 3px;
        background-color: #fff;
        color: #000;
        border: 1px solid #ccc;
      }

      .module-btn:hover {
        background-color: #000;
        color: #fff;
      }

      .module-btn svg {
        height: 10px;
        width: 10px;
      }

      .dark .module-btn {
        background-color: #3e3e3e;
        color: #fff;
        border: 1px solid #333;
      }

      .dark .module-btn:hover {
        background-color: #fff;
        color: #3e3e3e;
        border: 1px solid #333;
      }

      .module-btn button:disabled svg {
        color: #555;
      }

      .module-body {
        padding: 6px;
      }

      .log-body {
        overflow: auto;
        height: min(60vh, 850px);
        min-height: 220px;
        resize: vertical;
      }

      .log-time-controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
        gap: 6px;
        margin-top: 6px;
        font-size: 0.9em;
      }

      .log-filters {
        margin-top: 5px;
        padding: 5px 8px;
      }

      .log-filters summary {
        cursor: pointer;
        font-size: 0.9em;
        font-weight: bold;
      }

      .log-time-control {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .log-time-control-inputs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        width: 100%;
        min-width: 0;
      }

      .log-time-range {
        box-sizing: border-box;
        flex: 1 1 140px;
        min-width: 0;
        max-width: 100%;
      }

      .log-time-control-inputs > input[type="datetime-local"] {
        box-sizing: border-box;
        flex: 1 1 100%;
        min-width: 0;
        max-width: 100%;
      }

      .log-text-controls {
        display: flex;
        gap: 4px;
        min-width: 0;
      }

      .log-text-controls .log-filter {
        box-sizing: border-box;
        flex: 1 1 auto;
        min-width: 0;
      }

      .log-exclude-filter {
        box-sizing: border-box;
        width: 100%;
      }

      .request-history-body {
        overflow: auto;
        height: 350px;
        resize: vertical;
      }

      .request-history-body.empty {
        height: auto;
      }

      .state-history-body {
        overflow: auto;
        height: 350px;
        resize: vertical;
      }

      .state-history-body.empty {
        height: auto;
      }

      .log-body pre {
        margin: 0px 0px;
        padding: 5px 0px;
      }

      .light .log-error {
        color: #aa0000;
      }
      .light .log-warn {
        color: #555500;
      }
      .light .log-info {
        color: #0000aa;
      }
      .light .log-network {
        color: #005555;
      }
      .dark .log-error {
        color: #ff4444;
      }
      .dark .log-warn {
        color: #ffff00;
      }
      .dark .log-info {
        color: #b5b5ff;
      }
      .dark .log-network {
        color: #75d9ff;
      }

      .light .focused {
        background-color: #fffcd6;
      }
      .dark .focused {
        background-color: #0b5109;
      }

      .closed-modules {
        margin: 5px;
        box-sizing: border-box;
        width: calc(100% - 10px);
      }
      .light .closed-modules {
        border: 1px solid #b2b5bf;
        background-color: #fff;
      }
      .dark .closed-modules {
        border: 1px solid #5c5c5c;
        background-color: #000;
      }

      .closed-modules-title {
        padding: 5px;
        display: block;
        font-weight: bold;
        font-size: 14px;
        position: relative;
      }
      .light .closed-modules-title {
        color: #000;
        background-color: #c3c3c3;
        background: linear-gradient(to left, #fff, #f2f2f2);
        border: 1px dotted #868686;
      }
      .dark .closed-modules-title {
        color: #000;
        background-color: #b5b2b2;
        background: linear-gradient(to right, #b5b2b2, #1a1a1a);
      }

      .closed-module-elt {
        margin: 5px 5px;
        display: inline-block;
        cursor: pointer;
        font-size: 12px;
        padding: 4px 5px;
        font-weight: bold;
      }
      .light .closed-module-elt {
        border: 1px solid #b2b5bf;
        background: -webkit-linear-gradient(to left, #fff, #f2f2f2);
        background: linear-gradient(to left, #fff, #f2f2f2);
      }
      .dark .closed-module-elt {
        border: 1px solid #5c5c5c;
        color: #fff;
        background-color: #242424;
        background-image: linear-gradient(191deg, #444 0%, #242424 74%);
      }

      .light .focused-bg {
        background-color: #ffffaa;
      }

      .dark .focused-bg {
        background-color: #505035;
      }

      .light .important-bg {
        background-color: #c4ffd0;
      }

      .dark .important-bg {
        background-color: #6a3d3d;
      }

      .page-controls {
        display: flex;
      }
    </style>
  </head>
  <body class="light">
    <script
      type="text/javascript"
      src="./inspector.js"
      charset="utf-8"
    ></script>
  </body>
</html>
